<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Coffee Shop NYC · V2</title>
<meta name="description" content="A one- or two-player rhythm café. Two counters, clear controls, and a shared order board.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  html,body{margin:0;height:100%;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;background:#3f9fb0}
  canvas{display:block;outline:none;border:3px solid #1f1a2e;border-radius:6px}

<body>
<canvas id="c" tabindex="0"></canvas>
<script>
"use strict";
// ======================================================================
//  COFFEE SHOP NYC — comic flat-illustration rhythm café game (1–2 players)
// ======================================================================
const W = 1280, H = 720;
const FT = "'Lilita One','Fredoka',sans-serif", FB = "'Fredoka','Lilita One',sans-serif", FH = "'Caveat Brush','Fredoka',cursive";
const INK = '#1f1a2e';
const C = {
  ink: INK, mint: '#dcf1e3', mintD: '#b7dcc5', teal: '#6cc3cf', tealD: '#3f9fb0', tealL: '#a9e0e6', red: '#ee5136', redD: '#c23a24', orange: '#f5923a',
  yellow: '#ffd33d', yellowL: '#ffe98f', cream: '#fdf6e6', paper: '#fffaf0', green: '#3e9e4f', greenL: '#9ad16a', greenD: '#2a7a3a', pink: '#f79ac0', pinkL: '#fcd3e3', pinkD: '#e2648f',
  blue: '#3b6fd1', blueL: '#bcd9f5', lav: '#a99af0', lavL: '#dcd5fb', purple: '#7a4fc9', brown: '#8a5a3a', wood: '#e8b07a', woodD: '#c98a52', grey: '#d3d1de', greyD: '#8e89a8',
  brick: '#e0705a', brickD: '#b94a38', coffee: '#4f2c1c', choc: '#6b3a26', caramel: '#e59a2f', vanilla: '#f6e2a0', taxi: '#ffcf2e', road: '#3e5a66', walk: '#a3a5c6', white: '#ffffff'
};
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let RS = 1;
function resize(){
  const s = Math.min((innerWidth - 8) / W, (innerHeight - 8) / H), dpr = window.devicePixelRatio || 1; RS = Math.min(s * dpr, 2.5);
  cv.width = Math.round(W * RS); cv.height = Math.round(H * RS); cv.style.width = Math.round(W * s) + 'px'; cv.style.height = Math.round(H * s) + 'px';
  buildCaches();
}
let seed = 1;
function srand(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
const rnd = (a, b) => a + Math.random() * (b - a), rint = (a, b) => Math.floor(rnd(a, b + 1)), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

// ================== ink helpers ==================
function ink(g, lw = 2.2){ g.lineWidth = lw; g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = INK; g.stroke(); }
function sf(g, fill, lw = 2.2){ if (fill){ g.fillStyle = fill; g.fill(); } if (lw) ink(g, lw); }
function fl(g, col){ g.fillStyle = col; g.fill(); }
function circ(g, x, y, r){ g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); }
function ell(g, x, y, rx, ry){ g.beginPath(); g.ellipse(x, y, Math.max(rx, 0.1), Math.max(ry, 0.1), 0, 0, Math.PI * 2); }
function rr(g, x, y, w, h, r){ r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2)); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function poly(g, pts){ g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); }
function line(g, x1, y1, x2, y2, lw = 2.2, col = INK){ g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineWidth = lw; g.strokeStyle = col; g.lineCap = 'round'; g.stroke(); }
function txt(g, s, x, y, o = {}){
  g.save(); const f = o.f === 't' ? FT : o.f === 'h' ? FH : FB;
  g.font = `${o.f === 'b' || !o.f ? (o.w || 600) + ' ' : ''}${o.size || 22}px ${f}`; g.textAlign = o.align || 'center'; g.textBaseline = 'middle';
  if (o.rot){ g.translate(x, y); g.rotate(o.rot); x = 0; y = 0; }
  if (o.shadow){ g.fillStyle = o.shadow; g.fillText(s, x + (o.sx || 3), y + (o.sy || 3)); }
  if (o.stroke){ g.lineJoin = 'round'; g.lineWidth = o.lw || 6; g.strokeStyle = o.stroke; g.strokeText(s, x, y); }
  g.fillStyle = o.color || INK; g.fillText(s, x, y); g.restore();
}
function measure(s, size, f){ ctx.save(); ctx.font = `600 ${size}px ${f === 't' ? FT : FB}`; const w = ctx.measureText(s).width; ctx.restore(); return w; }
function star(g, x, y, r, col, lw = 2, rot = 0){ g.beginPath(); for (let i = 0; i < 10; i++){ const a = rot - Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.46 : r; g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); } g.closePath(); sf(g, col, lw); }
function sparkle(g, x, y, r, col){ g.beginPath(); g.moveTo(x, y - r); g.quadraticCurveTo(x, y, x + r, y); g.quadraticCurveTo(x, y, x, y + r); g.quadraticCurveTo(x, y, x - r, y); g.quadraticCurveTo(x, y, x, y - r); g.closePath(); sf(g, col, 1.6); }
function heart(g, x, y, s, col, lw = 2){ g.beginPath(); g.moveTo(x, y + s * 0.9); g.bezierCurveTo(x - s * 1.3, y - s * 0.1, x - s * 0.6, y - s * 1.1, x, y - s * 0.4); g.bezierCurveTo(x + s * 0.6, y - s * 1.1, x + s * 1.3, y - s * 0.1, x, y + s * 0.9); g.closePath(); sf(g, col, lw); }
function leaf(g, x, y, l, a, col){ g.save(); g.translate(x, y); g.rotate(a); g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(l * 0.5, -l * 0.38, l, 0); g.quadraticCurveTo(l * 0.5, l * 0.38, 0, 0); g.closePath(); sf(g, col, 1.8); line(g, 2, 0, l * 0.75, 0, 1.2); g.restore(); }
function keycap(g, k, x, y, w = 26, col = C.paper){ rr(g, x - w / 2, y - 9, w, 22, 6); fl(g, INK); rr(g, x - w / 2, y - 13, w, 22, 6); sf(g, col, 2); txt(g, k, x, y - 2, { f: 't', size: k.length > 2 ? 10 : 14 }); }
function stripes(g, x, y, w, h, col, step = 8, lw = 3, vertical = false){ g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); if (vertical) for (let i = x; i < x + w; i += step){ g.moveTo(i, y); g.lineTo(i, y + h); } else for (let i = y; i < y + h; i += step){ g.moveTo(x, i); g.lineTo(x + w, i); } g.stroke(); g.restore(); }
function plant(g, x, y, s = 1, pot = C.red){ g.save(); g.translate(x, y); g.scale(s, s); for (let i = 0; i < 5; i++) leaf(g, 0, -14, 18 + (i % 2) * 5, -Math.PI / 2 + (i - 2) * 0.5, i % 2 ? C.greenL : C.green); poly(g, [[-10, -16], [10, -16], [7, 0], [-7, 0]]); sf(g, pot, 2); g.restore(); }

// ================== drinks & food ==================
const SYRUPS = { vanilla: { name: 'VANILLA', col: C.vanilla, tag: C.yellow }, caramel: { name: 'CARAMEL', col: C.caramel, tag: C.orange }, choc: { name: 'CHOCO', col: C.choc, tag: C.brown } };
function liquidCol(cup){
  if (cup.foam && cup.kind === 'hot') return '#f6ead8';
  if (cup.milk > 0){ if (cup.syrup === 'choc') return '#9a6040'; if (cup.syrup === 'caramel') return '#d8a060'; return cup.shots ? '#c99a6e' : '#f6efe4'; }
  if (cup.water > 0) return cup.shots ? '#6e3f24' : '#cfe8f5';
  return cup.shots ? C.coffee : null;
}
function drawCup(g, cup, x, y, s = 1){
  g.save(); g.translate(x, y); g.scale(s, s);
  const iced = cup && cup.kind === 'iced', Hh = iced ? 50 : 44, tw = iced ? 19 : 18, bw = iced ? 14 : 13;
  ell(g, 1, 1, 17, 4); fl(g, 'rgba(31,26,46,.18)');
  const path = () => poly(g, [[-tw, -Hh], [tw, -Hh], [bw, 0], [-bw, 0]]);
  const lc = cup ? liquidCol(cup) : null;
  if (iced){
    path(); fl(g, 'rgba(220,240,252,.8)');
    g.save(); path(); g.clip();
    const lvl = -clamp(cup.fill, 0, 1) * (Hh - 4);
    if (lc){
      if (cup.milk > 0 && cup.shots){ g.fillStyle = '#f6efe4'; g.fillRect(-tw, lvl, tw * 2, -lvl); g.fillStyle = cup.syrup === 'caramel' ? '#c98a3a' : C.coffee; g.beginPath(); g.moveTo(-tw, lvl); for (let xx = -tw; xx <= tw; xx += 4) g.lineTo(xx, lvl + 8 + Math.sin(xx * 0.5 + (cup.wave || 0)) * 2); g.lineTo(tw, lvl); g.closePath(); g.fill(); }
      else { g.fillStyle = lc; g.fillRect(-tw, lvl, tw * 2, -lvl); }
    }
    if (cup.ice) for (let i = 0; i < 5; i++){ g.save(); g.translate(-11 + (i % 3) * 11 + (i > 2 ? 5 : 0), Math.min(-12, lvl + 8) - Math.floor(i / 3) * 10); g.rotate(i % 2 ? 0.3 : -0.25); rr(g, -5, -5, 10, 10, 2); sf(g, 'rgba(255,255,255,.85)', 1.5); g.restore(); }
    g.restore(); path(); ink(g, 2.2);
    line(g, -tw + 6, -Hh + 6, -bw + 4, -6, 2.5, 'rgba(255,255,255,.9)');
    ell(g, 0, -Hh, tw, 4); sf(g, 'rgba(255,255,255,.6)', 2);
    if (cup.served){ g.save(); g.translate(6, -Hh); g.rotate(0.22); rr(g, -3, -26, 6, 30, 2); sf(g, C.red, 2); stripes(g, -3, -26, 6, 30, '#fff', 6, 2); g.restore(); }
  } else {
    path(); sf(g, C.paper, 2.2);
    g.save(); path(); g.clip(); g.fillStyle = C.teal; g.fillRect(-tw, -Hh * 0.62, tw * 2, Hh * 0.36); g.restore();
    line(g, -tw * 0.92, -Hh * 0.62, tw * 0.92, -Hh * 0.62, 2); line(g, -tw * 0.8, -Hh * 0.26, tw * 0.8, -Hh * 0.26, 2);
    txt(g, '☕', 0, -Hh * 0.44, { size: 9, color: '#fff' });
    ell(g, 0, -Hh, tw + 1.5, 5); sf(g, C.paper, 2.2);
    if (lc){ ell(g, 0, -Hh, tw - 2, 3.4); sf(g, lc, 1.4); if (cup.foam) heart(g, 0, -Hh, 2.4, '#c99a6e', 1); }
    if (cup.served){ rr(g, -tw - 1, -Hh - 4, tw * 2 + 2, 6, 3); sf(g, C.red, 2); }
  }
  g.restore();
}
function drawFood(g, kind, state, x, y, s = 1){
  g.save(); g.translate(x, y); g.scale(s, s);
  const burnt = state === 'burnt', done = state === 'done';
  if (kind === 'bagel'){
    ell(g, 0, -8, 22, 13); sf(g, burnt ? '#4a2c1e' : done ? '#d98c45' : '#f0c27e', 2.2); ell(g, 0, -9, 7, 4); sf(g, C.paper, 2);
    if (!burnt){ seed = 4; for (let i = 0; i < 9; i++){ const a = srand() * 6.28, r = 10 + srand() * 6; ell(g, Math.cos(a) * r, -8 + Math.sin(a) * r * 0.55, 1.6, 1); fl(g, i % 2 ? C.paper : INK); } }
  } else {
    g.beginPath(); g.moveTo(-24, -4); g.quadraticCurveTo(-18, -24, 0, -26); g.quadraticCurveTo(18, -24, 24, -4); g.quadraticCurveTo(0, 4, -24, -4); g.closePath(); sf(g, burnt ? '#4a2c1e' : done ? '#e6923a' : '#f5c47a', 2.2);
    g.save(); g.strokeStyle = INK; g.lineWidth = 1.8; for (const xx of [-12, 0, 12]){ g.beginPath(); g.moveTo(xx - 4, -24 + Math.abs(xx) * 0.4); g.quadraticCurveTo(xx + 2, -12, xx - 2, -2); g.stroke(); } g.restore();
  }
  if (burnt) for (let i = 0; i < 3; i++){ circ(g, -8 + i * 8, -28 - i * 4, 6); sf(g, C.greyD, 1.5); }
  if (done) sparkle(g, 18, -24, 5, C.yellow);
  g.restore();
}

// ================== comic people ==================
const SKINS = ['#f6d2b8', '#eab88e', '#c98a5e', '#8e5a3a', '#5e3a26'];
const HAIRC = ['#2a1d1a', '#5a3a26', '#b06a3a', '#e3c27a', '#9a98b0', '#e05a8a', '#2a1d1a'];
const TOPC = [C.red, C.blue, C.pink, C.yellow, C.green, C.purple, C.orange, '#7ecbe8', '#8a2a3a', C.teal];
const HAIRS = ['short', 'curly', 'long', 'bun', 'afro', 'bald', 'pony'];
const TOPS = ['hoodie', 'stripe', 'jacket', 'track', 'tee'];
const ACCS = ['beanie', 'cap', 'phones', 'shades', 'glasses', 'none', 'none', 'scarf'];
const NAMES = ['Maya', 'Leo', 'Ines', 'Theo', 'Rosa', 'Kai', 'Noor', 'Sam', 'Jules', 'Omar', 'Bea', 'Dev', 'Lu', 'Max', 'Iris', 'Andre', 'Pia', 'Rex'];
function randLook(){
  const top = pick(TOPS), hair = pick(HAIRS);
  return { skin: pick(SKINS), hair, hairC: pick(HAIRC), top, topC: pick(TOPC), top2: pick(TOPC), acc: pick(ACCS), accC: pick([C.red, C.yellow, C.green, C.blue, C.pink, C.orange]), face: Math.random() < 0.25 && hair !== 'long' ? pick(['beard', 'stache']) : 'none', pants: pick(['#2d3a6a', '#3e9e4f', '#8a5a3a', '#e2648f', '#1f1a2e', '#7a4fc9', '#c98a52']), shoe: pick(['#fff', C.blue, C.lav, C.red, INK]) };
}
// front-facing upper body (origin: bottom of torso)
function drawPersonFront(g, L, mood, time, wave = 0){
  // back hair
  const hy = -86;
  if (L.hair === 'long'){ rr(g, -24, hy - 12, 48, 58, 16); sf(g, L.hairC, 2.2); }
  if (L.hair === 'afro'){ circ(g, 0, hy - 8, 32); sf(g, L.hairC, 2.2); }
  if (L.hair === 'pony'){ ell(g, 24, hy + 8, 8, 18); sf(g, L.hairC, 2.2); }
  // torso
  g.beginPath(); g.moveTo(-32, 4); g.lineTo(-30, -44); g.quadraticCurveTo(-28, -60, -12, -62); g.lineTo(12, -62); g.quadraticCurveTo(28, -60, 30, -44); g.lineTo(32, 4); g.closePath(); sf(g, L.topC, 2.4);
  if (L.top === 'hoodie'){ g.beginPath(); g.moveTo(-18, -62); g.quadraticCurveTo(0, -48, 18, -62); g.quadraticCurveTo(0, -72, -18, -62); sf(g, L.top2, 2); line(g, -5, -54, -6, -36, 1.8); line(g, 5, -54, 6, -36, 1.8); rr(g, -16, -22, 32, 14, 5); ink(g, 1.8); }
  if (L.top === 'stripe'){ g.save(); g.beginPath(); g.moveTo(-32, 4); g.lineTo(-30, -44); g.quadraticCurveTo(-28, -60, -12, -62); g.lineTo(12, -62); g.quadraticCurveTo(28, -60, 30, -44); g.lineTo(32, 4); g.closePath(); g.clip(); stripes(g, -34, -64, 70, 70, L.top2, 9, 4); g.restore(); g.beginPath(); g.moveTo(-32, 4); g.lineTo(-30, -44); g.quadraticCurveTo(-28, -60, -12, -62); g.lineTo(12, -62); g.quadraticCurveTo(28, -60, 30, -44); g.lineTo(32, 4); ink(g, 2.4); }
  if (L.top === 'jacket'){ poly(g, [[-10, -62], [10, -62], [8, 4], [-8, 4]]); sf(g, L.top2, 2); line(g, -10, -62, -16, -30, 2); line(g, 10, -62, 16, -30, 2); circ(g, -18, -18, 2); fl(g, INK); }
  if (L.top === 'track'){ line(g, 0, -60, 0, 4, 2); line(g, -26, -50, -28, 2, 4, '#fff'); line(g, 26, -50, 28, 2, 4, '#fff'); rr(g, -3, -52, 6, 8, 2); sf(g, C.grey, 1.5); }
  if (L.top === 'tee'){ g.beginPath(); g.arc(0, -62, 8, 0, Math.PI); ink(g, 2); }
  if (L.acc === 'scarf'){ rr(g, -18, -66, 36, 10, 5); sf(g, L.accC, 2); rr(g, 6, -60, 9, 24, 3); sf(g, L.accC, 2); }
  // arms (wave when happy)
  if (wave){ for (const sg of [-1, 1]){ g.save(); g.translate(sg * 28, -50); g.rotate(sg * (2.5 + Math.sin(time * 14) * 0.25)); rr(g, -6, -2, 12, 30, 6); sf(g, L.topC, 2.2); circ(g, 0, 30, 6); sf(g, L.skin, 2); g.restore(); } }
  // neck & head
  rr(g, -6, -70, 12, 10, 3); sf(g, L.skin, 2);
  ell(g, 0, hy, 19, 22); sf(g, L.skin, 2.4);
  ell(g, -19, hy + 2, 4, 6); sf(g, L.skin, 1.8); ell(g, 19, hy + 2, 4, 6); sf(g, L.skin, 1.8);
  // front hair
  if (L.hair === 'short' || L.hair === 'pony' || L.hair === 'long' || L.hair === 'bun'){ g.beginPath(); g.moveTo(-20, hy - 2); g.quadraticCurveTo(-22, hy - 26, 0, hy - 25); g.quadraticCurveTo(22, hy - 26, 20, hy - 2); g.quadraticCurveTo(10, hy - 16, -4, hy - 13); g.quadraticCurveTo(-14, hy - 12, -20, hy - 2); g.closePath(); sf(g, L.hairC, 2.2); }
  if (L.hair === 'bun'){ circ(g, 0, hy - 28, 9); sf(g, L.hairC, 2.2); }
  if (L.hair === 'curly'){ for (let i = 0; i < 7; i++){ const a = Math.PI * (1.05 + i * 0.15); circ(g, Math.cos(a) * 18, hy - 4 + Math.sin(a) * 19, 7.5); sf(g, L.hairC, 2); } }
  if (L.hair === 'afro'){ g.beginPath(); g.arc(0, hy - 8, 26, Math.PI * 1.08, Math.PI * 1.92); g.quadraticCurveTo(0, hy - 14, -22, hy - 20); g.closePath(); fl(g, L.hairC); }
  // face
  const ex = 7, ey = hy - 1;
  if (L.acc === 'shades'){ rr(g, -16, ey - 5, 13, 9, 4); sf(g, C.greenL, 2); rr(g, 3, ey - 5, 13, 9, 4); sf(g, C.greenL, 2); line(g, -3, ey - 2, 3, ey - 2, 2); }
  else if (mood === 2){ for (const sg of [-1, 1]){ g.beginPath(); g.arc(sg * ex, ey + 1, 3.5, Math.PI * 1.15, Math.PI * 1.85); ink(g, 2); } }
  else if (mood === -1){ for (const sg of [-1, 1]){ circ(g, sg * ex, ey, 2); fl(g, INK); line(g, sg * ex - sg * 5, ey - 7, sg * ex + sg * 3, ey - 4, 2); } }
  else { for (const sg of [-1, 1]){ circ(g, sg * ex, ey, 2.1); fl(g, INK); } if (mood === 0){ line(g, -11, ey - 6, -3, ey - 7, 1.8); line(g, 11, ey - 6, 3, ey - 7, 1.8); } }
  if (L.acc === 'glasses'){ circ(g, -ex, ey, 6); ink(g, 1.8); circ(g, ex, ey, 6); ink(g, 1.8); line(g, -1, ey, 1, ey, 1.8); }
  g.beginPath(); g.moveTo(1, ey + 2); g.lineTo(4, ey + 9); g.lineTo(0, ey + 10); ink(g, 1.8);
  if (L.face === 'beard'){ g.beginPath(); g.moveTo(-17, hy + 4); g.quadraticCurveTo(-16, hy + 26, 0, hy + 27); g.quadraticCurveTo(16, hy + 26, 17, hy + 4); g.quadraticCurveTo(8, hy + 14, 0, hy + 13); g.quadraticCurveTo(-8, hy + 14, -17, hy + 4); sf(g, L.hairC, 2); }
  if (L.face === 'stache'){ g.beginPath(); g.moveTo(-9, ey + 15); g.quadraticCurveTo(0, ey + 9, 9, ey + 15); g.quadraticCurveTo(0, ey + 13, -9, ey + 15); sf(g, L.hairC, 1.8); }
  if (L.face !== 'beard'){ g.beginPath(); if (mood >= 1) g.arc(0, ey + 13, mood === 2 ? 5 : 3.5, 0.15 * Math.PI, 0.85 * Math.PI); else if (mood === 0){ g.moveTo(-4, ey + 15); g.lineTo(4, ey + 15); } else g.arc(0, ey + 20, 4.5, 1.2 * Math.PI, 1.8 * Math.PI); ink(g, 2); }
  circ(g, -12, ey + 8, 3.2); fl(g, 'rgba(255,110,140,.35)'); circ(g, 12, ey + 8, 3.2); fl(g, 'rgba(255,110,140,.35)');

// ---------- customers ----------
function genOrder(){
  const n = G.spawned, d = dayT();
  if (n === 0) return MENU.latte; if (n === 1) return MENU.bagel;
  const pool = d < 0.12 ? POOLS.early : d < 0.5 ? POOLS.afternoon : POOLS.night;

}
function spawnCustomer(){
  const free = []; slots.forEach((s, i) => { if (!s) free.push(i); });

  if (!free.length || custs.filter(c => c.state === 'wait' || c.state === 'enter').length >= limit) return false;
  const slot = pick(free), R = genOrder();
  const cx = R.food ? 0 : (R.shots - 1) * 8 + (R.milk ? 6 : 0) + (R.water ? 4 : 0) + (R.syrup ? 10 : 0) + (R.foam ? 10 : 0) + (R.ice ? 6 : 0);

  const max = rint(mode === 1 ? 75 : 60, mode === 1 ? 135 : 110) + cx + (G.spawned < 3 ? 30 : 0);
  const cu = { slot, L: randLook(), name: pick(NAMES), R, pat: max, max, x: Math.random() < 0.5 ? WIN.x - 60 : WIN.x + WIN.w + 60, state: 'enter', t: 0, got: null };

}
function updateCustomers(dt){
  G.nextCust -= dt;
  if (G.nextCust <= 0){
    const ok = spawnCustomer(), d = dayT();
    let iv = mode === 1 ? lerp(30, 19, Math.min(1, d * 1.6)) : lerp(20, 12, Math.min(1, d * 1.6));
    if (G.spawned <= 2) iv = mode === 1 ? 24 : 15;
    if (G.rush) iv *= 0.85;
    if (!custs.some(c => c.state === 'wait' || c.state === 'enter')) iv = Math.min(iv, 2.5);
    G.nextCust = ok ? iv : 2;
  }
  for (const cu of custs){
    cu.t += dt; const tx = slotX(cu.slot);
    if (cu.state === 'enter'){ const dx = tx - cu.x; cu.x += Math.sign(dx) * Math.min(Math.abs(dx), dt * 260); if (Math.abs(dx) < 2){ cu.x = tx; cu.state = 'wait'; } }

    if (cu.state === 'angry' && cu.t > 1.1){ cu.state = 'leave'; cu.t = 0; }
    if (cu.state === 'leave') cu.x += (cu.slot < 2 ? -1 : 1) * dt * 260;

}

function fits(it, R){

  if (it.type !== 'cup') return `I ordered a ${R.name}!`;
  if (it.kind !== R.kind) return R.kind === 'iced' ? 'I wanted it ICED!' : 'I wanted it HOT!';
  if (it.shots !== R.shots) return `${R.shots} shot${R.shots > 1 ? 's' : ''}, please!`;
  if (!!R.milk !== it.milk >= 0.25) return R.milk ? 'Needs milk!' : 'No milk for me!';
  if (!!R.water !== it.water >= 0.25) return R.water ? 'Needs hot water!' : 'No water!';

  if (R.syrup && (it.syrup !== R.syrup || it.pumps < PUMP_N)) return `2 pumps of ${SYRUPS[R.syrup].name}!`;

function clockFace(cx, cy, r){
  // a real wall clock: from 2 pm to midnight across the shift
  const hours = 14 + dayT() * 10, hh = hours % 12, mm = (hours % 1) * 60;
  circ(ctx, cx, cy, r); sf(ctx, C.paper, 2.4);
  for (let i = 0; i < 12; i++){ const a = i / 12 * Math.PI * 2; line(ctx, cx + Math.cos(a) * (r - 6), cy + Math.sin(a) * (r - 6), cx + Math.cos(a) * (r - 2), cy + Math.sin(a) * (r - 2), i % 3 ? 1.4 : 2.4); }
  const ah = hh / 12 * Math.PI * 2 - Math.PI / 2, am = mm / 60 * Math.PI * 2 - Math.PI / 2;
  line(ctx, cx, cy, cx + Math.cos(ah) * r * 0.5, cy + Math.sin(ah) * r * 0.5, 3.5); line(ctx, cx, cy, cx + Math.cos(am) * r * 0.75, cy + Math.sin(am) * r * 0.75, 2.2, C.red); circ(ctx, cx, cy, 3); fl(ctx, INK);
  return Math.floor(hours % 12 || 12) + ':' + String(Math.floor(mm)).padStart(2, '0') + (hours >= 12 && hours < 24 ? ' PM' : ' AM');
}

  AU.init(); keysDown.add(e.code); if (e.repeat) return;
  if (e.code === 'KeyM'){ AU.toggleMute(); return; }
